[manifest]
version = "1.0.0"
dump = false

# create the I'm Feeling Lucky tab in the New Run panel
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
} or {
  label = localize('b_challenges'),
  tab_definition_function = G.UIDEF.challenges,
  tab_definition_function_args = from_game_over,
  chosen = _challenge_chosen
},
G.STAGE == G.STAGES.MAIN_MENU and {
  label = localize('b_challenges'),
  tab_definition_function = G.UIDEF.challenges,
  tab_definition_function_args = from_game_over,
  chosen = _challenge_chosen
} or nil,
'''
position = "at"
match_indent = true
payload = '''
} or {
  label = localize('b_challenges'),
  tab_definition_function = G.UIDEF.challenges,
  tab_definition_function_args = from_game_over,
  chosen = _challenge_chosen
},
G.STAGE == G.STAGES.MAIN_MENU and {
  label = localize('b_challenges'),
  tab_definition_function = G.UIDEF.challenges,
  tab_definition_function_args = from_game_over,
  chosen = _challenge_chosen
} or {
    label = "I'm Feeling Lucky!",
    tab_definition_function = G.UIDEF.im_feeling_lucky_setup_option,
},
G.STAGE == G.STAGES.MAIN_MENU and {
    label = "I'm Feeling Lucky!",
    tab_definition_function = G.UIDEF.im_feeling_lucky_setup_option,
} or nil,
'''

[manifest]
version = "1.0.0"
dump = false

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "UIBox_button{id = 'main_menu_play', button = not G.SETTINGS.tutorial_complete and \"start_run\" or \"setup_run\", colour = G.C.BLUE, minw = 3.65, minh = 1.55, label = {localize('b_play_cap')}, scale = text_scale*2, col = true},"
position = "after"
match_indent = true

#TODO(denneyl): would be nice to have this in a place where we have intellisense
# also this just looks bad UI-wise
payload = '''
{
    n = G.UIT.R,
    config = { align = "cm", padding = 0.1 },
    nodes = {
        {
            n = G.UIT.C,
            config = {
                align = "cm",
                minw = 2.5,
                minh = 0.8,
                r = 0.1,
                padding = 0.1,
                button = "im_feeling_lucky",
                colour = G.C.BLUE,
                shadow = true
            },
            nodes = {
                { n = G.UIT.T, config = { text = "I'm Feeling Lucky!", scale = 0.4, colour = G.C.WHITE } }
            }
        }
    }
},
'''
